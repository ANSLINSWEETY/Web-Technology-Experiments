<!DOCTYPE html>
<html>
<head>
    <title>Simple Comment Box</title>
    <script src="https://code.angularjs.org/1.6.9/angular.js"></script>
</head>
<body ng-app="myApp">
    <div ng-controller="FrmController">
        <h2>Post Your Comment</h2>
        <textarea ng-model="txtcomment"
                  placeholder="Your Comment"
                  style="width:400px; height:80px;">
        </textarea>
        <br><br>
        <button ng-click="btn_add()">Post Comment</button>
        <h3>Comments</h3>
        <ul>
            <li ng-repeat="comnt in comment">
                {{comnt}}
                <button ng-click="remItem($index)">x</button>
            </li>
        </ul>
    </div>
    <script>
        angular.module("myApp", [])
        .controller("FrmController", function($scope) {
            $scope.comment = [];
            $scope.btn_add = function() {
                if ($scope.txtcomment != "") {
                    $scope.comment.push($scope.txtcomment);
                    $scope.txtcomment = "";
                }
            };
            $scope.remItem = function(index) {
                $scope.comment.splice(index, 1);
            };
        });
    </script>
</body>
</html>
