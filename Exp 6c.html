<html>
<body>
<h2>Change Font Size</h2>
<p id="p" onmouseover="big()" onmouseout="small()">
Move mouse over me
</p>
<script>
function big() {
document.getElementById("p").style.fontSize = "30px";
}
function small() {
document.getElementById("p").style.fontSize = "16px";
}
</script>
</body>
</html>
