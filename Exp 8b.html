<!DOCTYPE html>
<html>
<head>
    <title>AngularJS Calculator</title>
    <script src="https://code.angularjs.org/1.6.9/angular.js"></script>
</head>
<body ng-app="CalculatorApp">
<div ng-controller="CalculatorController">
    <h2>Simple Calculator</h2>
    <input type="number" ng-model="a" placeholder="Enter number">
    <br><br>
    <input type="number" ng-model="b" placeholder="Enter number">
    <br><br>
    <select ng-model="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <h3>Result: {{result()}}</h3>
</div>
<script>
angular.module("CalculatorApp", [])
.controller("CalculatorController", function($scope) {
    $scope.result = function() {
        if ($scope.operator == "+")
            return $scope.a + $scope.b;
        if ($scope.operator == "-")
            return $scope.a - $scope.b;
        if ($scope.operator == "*")
            return $scope.a * $scope.b;
        if ($scope.operator == "/")
            return $scope.a / $scope.b;
    };

});
</script>
</body>
</html>
