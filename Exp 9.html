<!DOCTYPE html>
<html ng-app="myApp">
<head>
<title>AngularJS Form Validation and Routing</title>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular-route.js"></script>
<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f2f2f2;
}
header {
    background: navy;
    color: white;
    text-align: center;
    padding: 15px;
}
nav {
    background: #333;
    padding: 15px;
    text-align: center;
}
nav a {
    color: white;
    margin: 12px;
    text-decoration: none;
}
.container {
    background: white;
    margin: 25px auto;
    padding: 20px;
    width: 420px;
    max-width: 85%;
    border-radius: 8px;
}
input, select, textarea {
    padding: 8px;
    margin: 6px 0;
    box-sizing: border-box;
}
input:not([type="radio"]), select, textarea {
    width: 100%;
}
.error {
    color: red;
    font-size: 13px;
}
button {
    padding: 10px 18px;
    background: green;
    color: white;
    border: none;
    cursor: pointer;
}
button:disabled {
    background: gray;
    cursor: not-allowed;
}
</style>
</head>
<body>
<header>
    <h1>My Website</h1>
    <p>AngularJS Form Validation and Routing</p>
</header>
<nav>
    <a href="#!/">Home</a>
    <a href="#!/about">About</a>
    <a href="#!/services">Services</a>
    <a href="#!/contact">Contact</a>
    <a href="#!/register">Registration</a>
</nav>
<div ng-view></div>
<script>
var app = angular.module("myApp", ["ngRoute"]);
app.config(function($routeProvider) {
    $routeProvider
    .when("/", {
        template: '<div class="container"><h2>Home Page</h2><p>Welcome to our website!</p><p>We provide useful information and services.</p></div>'
    })
    .when("/about", {
        template: '<div class="container"><h2>About Us</h2><p>We are a team dedicated to providing quality services.</p><p>Our goal is customer satisfaction.</p></div>'
    })
    .when("/services", {
        template: '<div class="container"><h2>Our Services</h2><ul><li>Web Development</li><li>Software Development</li><li>Technical Support</li></ul></div>'
    })
    .when("/contact", {
template:'<div class="container"><h2>Contact Us</h2><form><label>Name:</label><input type="text" required><br><label>Email:</label><input type="email" required><br><label>Message:</label><textarea required></textarea><br><button type="submit">Send</button></form></div>'
    })
    .when("/register", {
        template: '<div class="container"><h2>User Registration</h2><form name="regForm" ng-submit="success=true" novalidate><label>Name</label><input type="text" name="name" ng-model="user.name" ng-pattern="/^[a-zA-Z ]+/"required><spanclass="error"ng-show="regForm.name.touched && regForm.name.invalid">Enteravalidnamewithoutnumbers.</span><br><label>Password</label><inputtype="password"name="password"ng-model="user.password"ng-pattern="/^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).8,/" required><span class="error" ng-show="regForm.password.touched&&regForm.password.invalid">Use 8 characters with uppercase, lowercase and number.</span><br><label>Age</label><input type="number" name="age" ng-model="user.age" min="18" max="30" required><span class="error" ng-show="regForm.age.touched&&regForm.age.invalid">Age must be between 18 and 30.</span><br><label>Mobile Number</label><input type="text" name="mobile" ng-model="user.mobile" ng-pattern="/^[0-9]{10}/"required><spanclass="error"ng-show="regForm.mobile.touched && regForm.mobile.invalid">Entera10-digitmobilenumber.</span><br><label>Email</label><inputtype="email"name="email"ng-model="user.email"required><spanclass="error"ng-show="regForm.email.touched && regForm.email.invalid">Enteravalidemailaddress.</span><br><label>Gender</label><br><label><inputtype="radio"name="gender"ng-model="user.gender"value="Male"required>Male</label><label><inputtype="radio"name="gender"ng-model="user.gender"value="Female"required>Female</label><br><spanclass="error"ng-show="regForm.gender.touched && regForm.gender.invalid">Selectyourgender.</span><br><label>State</label><selectname="state"ng-model="user.state"required><optionvalue="">SelectState</option><option>TamilNadu</option><option>Kerala</option><option>Karnataka</option><option>AndhraPradesh</option></select><spanclass="error"ng-show="regForm.state.touched && regForm.state.invalid">Selectyourstate.</span><br><br><buttontype="submit"ng-disabled="regForm.invalid">Register</button><p style="color:green" ng-show="success && regForm.$valid">Registration Successful!</p></form></div>'
    })
    .otherwise({
        redirectTo: "/"
    });
});
</script>
</body>
</html>
